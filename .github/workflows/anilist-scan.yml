name: AniList V3 Read-only Dry-Run Sync

on:
  schedule:
    # Same cadence as the old anime engine: every 3 hours, specified in UTC.
    - cron: "30 2,5,8,11,14,17 * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "AniList username"
        required: false
        default: "Orewatokyo"
        type: string
      media_type:
        description: "Which list to inspect"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - anime
          - manga

permissions:
  actions: read
  contents: read

concurrency:
  group: anilist-v3-dry-run
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ANILIST_USERNAME: ${{ github.event.inputs.username || vars.ANILIST_USERNAME || 'Orewatokyo' }}
      ANILIST_TARGET_TOKEN: ${{ secrets.ANILIST_TARGET_TOKEN }}
      TRIPLE_SYNC_TIMEOUT: "20"
      TRIPLE_SYNC_RETRIES: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Verify AniList access token
        run: |
          set -euo pipefail
          python -m triple_sync.cli check-anilist-auth \\
            --expected-username "$ANILIST_USERNAME"
      - name: Locate previous baseline artifact
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sync-state
          found=false
          # Earlier successful runs may belong to the count-only scanner and have no baseline.
          for run_id in $(gh run list --workflow anilist-scan.yml --status completed --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' --limit 30); do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "anilist-v3-baseline" and .expired == false) | .id' | head -n 1)"
            if [[ -n "$artifact_id" ]]; then
              echo "Restoring baseline from successful run $run_id"
              gh run download "$run_id" --name anilist-v3-baseline --dir sync-state
              found=true
              break
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [[ "$found" == "false" ]]; then
            echo "No previous baseline artifact found; this scan will establish a silent baseline."
          fi
      - name: Run read-only inventory and dry-run comparison
        shell: bash
        run: |
          set -euo pipefail
          MEDIA_TYPE="${{ github.event.inputs.media_type || 'both' }}"
          python -m triple_sync.cli scan-anilist \
            --username "$ANILIST_USERNAME" \
            --media-type "$MEDIA_TYPE" \
            --state-dir sync-state \
            --summary-json artifacts/anilist-dry-run-summary.json
      - name: Upload minimal baseline (no titles)
        uses: actions/upload-artifact@v4
        with:
          name: anilist-v3-baseline
          path: sync-state/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload aggregate-only dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: anilist-v3-dry-run-summary
          path: artifacts/anilist-dry-run-summary.json
          if-no-files-found: error
          retention-days: 30
